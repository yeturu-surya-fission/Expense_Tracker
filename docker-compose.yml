# Three services that only talk over HTTP:
#   mcp     - the MCP server: tools, expense database, authentication  (port 8001)
#   bot     - the Telegram bot: Telegram + the AI agent; reaches expense data ONLY through the MCP server (port 8000)
#   finance - the Finance Agent: a company's reimbursement policy and claims, reached over A2A; has its own manager bot (port 8002)
# Each has its own database. Secrets come from your .env file (never baked into images); each service gets only what it needs.
services:
  mcp-db:
    image: postgres:16
    environment:
      POSTGRES_USER: expense
      POSTGRES_PASSWORD: ${MCP_DB_PASSWORD:-expense}
      POSTGRES_DB: expense_mcp
    # a NEW volume: older volumes (pgdata from the cash/bank version, pgdata_expense from the monolith) are left untouched
    volumes: [pgdata_mcp:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U expense -d expense_mcp"]
      interval: 3s
      retries: 20

  bot-db:
    image: postgres:16
    environment:
      POSTGRES_USER: expense
      POSTGRES_PASSWORD: ${BOT_DB_PASSWORD:-expense}
      POSTGRES_DB: expense_bot
    volumes: [pgdata_bot:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U expense -d expense_bot"]
      interval: 3s
      retries: 20

  finance-db:
    image: postgres:16
    environment:
      POSTGRES_USER: expense
      POSTGRES_PASSWORD: ${FINANCE_DB_PASSWORD:-expense}
      POSTGRES_DB: expense_finance
    volumes: [pgdata_finance:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U expense -d expense_finance"]
      interval: 3s
      retries: 20

  mcp:
    build:
      context: .
      dockerfile: Dockerfile.mcp
    environment:
      MCP_DATABASE_URL: postgresql+asyncpg://expense:${MCP_DB_PASSWORD:-expense}@mcp-db:5432/expense_mcp
      MCP_AUTO_CREATE_TABLES: "false"   # Alembic creates the schema
      MCP_ENV: ${MCP_ENV:-dev}
      MCP_PUBLIC_URL: ${MCP_PUBLIC_URL:-http://mcp:8001}
      MCP_BOT_CLIENT_SECRET: ${MCP_BOT_CLIENT_SECRET:?set MCP_BOT_CLIENT_SECRET in .env (a long random string shared with the bot)}
      MCP_JWT_PRIVATE_KEY: ${MCP_JWT_PRIVATE_KEY:-}
      MCP_ALLOWED_TELEGRAM_IDS: ${ALLOWED_TELEGRAM_IDS:-}
      MCP_CURRENCY_SYMBOL: ${CURRENCY_SYMBOL:-₹}
      MCP_TIMEZONE: ${TIMEZONE:-Asia/Kolkata}
      MCP_BUDGET_ALERT_THRESHOLDS: ${BUDGET_ALERT_THRESHOLDS:-50,80,100}
      MCP_REMINDER_EVERY_HOURS: ${REMINDER_EVERY_HOURS:-48}
      MCP_ASK_GROUP_MIN_PEOPLE: ${ASK_GROUP_MIN_PEOPLE:-4}
      # work reimbursements: where the Finance Agent is, and the secret that signs the decisions it sends back
      MCP_FINANCE_AGENT_URL: http://finance:8002
      MCP_FINANCE_WEBHOOK_SECRET: ${FINANCE_WEBHOOK_SECRET:?set FINANCE_WEBHOOK_SECRET in .env (a long random string shared with the Finance Agent)}
    ports: ["8001:8001"]
    depends_on:
      mcp-db: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8001/healthz', timeout=3).status == 200 else 1)"]
      interval: 5s
      retries: 20
    restart: unless-stopped

  bot:
    build:
      context: .
      dockerfile: Dockerfile.bot
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?set TELEGRAM_BOT_TOKEN in .env}
      TELEGRAM_MODE: ${TELEGRAM_MODE:-polling}
      PUBLIC_URL: ${PUBLIC_URL:-}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-change-me}
      CODEVECTOR_API_KEY: ${CODEVECTOR_API_KEY:?set CODEVECTOR_API_KEY in .env}
      CODEVECTOR_MODEL: ${CODEVECTOR_MODEL:-dev-model-alpha}
      CODEVECTOR_BASE_URL: ${CODEVECTOR_BASE_URL:-https://coding-gateway.fissionlabs.com/gateway/openai/v1}
      TIMEZONE: ${TIMEZONE:-Asia/Kolkata}
      MCP_SERVER_URL: http://mcp:8001/mcp
      MCP_BOT_CLIENT_ID: telegram-bot
      MCP_BOT_CLIENT_SECRET: ${MCP_BOT_CLIENT_SECRET:?set MCP_BOT_CLIENT_SECRET in .env}
      BOT_DATABASE_URL: postgresql://expense:${BOT_DB_PASSWORD:-expense}@bot-db:5432/expense_bot
    ports: ["8000:8000"]
    depends_on:
      bot-db: { condition: service_healthy }
      mcp: { condition: service_healthy }
    restart: unless-stopped

  finance:
    build:
      context: .
      dockerfile: Dockerfile.finance
    environment:
      FINANCE_DATABASE_URL: postgresql+asyncpg://expense:${FINANCE_DB_PASSWORD:-expense}@finance-db:5432/expense_finance
      FINANCE_PUBLIC_URL: http://finance:8002   # must equal MCP_FINANCE_AGENT_URL above (tokens are addressed to it)
      FINANCE_TRUSTED_ISSUER: ${MCP_PUBLIC_URL:-http://mcp:8001}   # the expense tracker's issuer: tokens signed by anyone else are refused
      FINANCE_TRUSTED_JWKS_URL: http://mcp:8001/.well-known/jwks.json
      FINANCE_TRACKER_WEBHOOK_URL: http://mcp:8001/a2a/webhook
      FINANCE_WEBHOOK_SECRET: ${FINANCE_WEBHOOK_SECRET:?set FINANCE_WEBHOOK_SECRET in .env}
      FINANCE_TELEGRAM_BOT_TOKEN: ${FINANCE_TELEGRAM_BOT_TOKEN:-}
      FINANCE_ALLOWED_MANAGER_IDS: ${FINANCE_ALLOWED_MANAGER_IDS:-}
      CODEVECTOR_API_KEY: ${CODEVECTOR_API_KEY:-}
      CODEVECTOR_MODEL: ${CODEVECTOR_MODEL:-dev-model-alpha}
      CODEVECTOR_BASE_URL: ${CODEVECTOR_BASE_URL:-https://coding-gateway.fissionlabs.com/gateway/openai/v1}
      CURRENCY_SYMBOL: ${CURRENCY_SYMBOL:-₹}
    ports: ["8002:8002"]
    depends_on:
      finance-db: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8002/healthz', timeout=3).status == 200 else 1)"]
      interval: 5s
      retries: 20
    restart: unless-stopped

volumes:
  pgdata_mcp:
  pgdata_bot:
  pgdata_finance:
