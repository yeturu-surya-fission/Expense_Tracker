    "langchain-core>=0.3",
    "langchain-openai>=0.2",
    "langgraph>=0.4",
    "langgraph-checkpoint-postgres>=2.0",
    "mcp>=2.3,<3",
    "psycopg[binary,pool]>=3.2",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-telegram-bot>=21.5",
    "tzdata",
    "uvicorn[standard]>=0.30",
]
finance = [
