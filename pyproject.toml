    "sqlalchemy[asyncio]>=2.0.30",
    "tzdata",
    "uvicorn[standard]>=0.30",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 88
target-version = "py312"
extend-exclude = ["mcp_server/migrations/versions"]

[tool.ruff.lint]
select = ["E", "F"]
ignore = ["E501"]  # the formatter owns line length

[tool.ruff.lint.per-file-ignores]
"mcp_server/tools/__init__.py" = ["F401"]  # imports register the tools
"tests/**" = ["E731", "F841"]
