[project]
name = "expense-tracker"
version = "0.1.0"
description = "Multi-agent expense tracker with Telegram, MCP server, and Finance Agent"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "a2a-sdk[http-server]>=1.3,<2",
    "alembic>=1.13",
    "asyncpg>=0.29",
    "cryptography>=43",
    "fastapi>=0.115",
    "fpdf2>=2.8",
    "httpx>=0.28",
    "langchain-core>=0.3",
    "langchain-openai>=0.2",
    "langgraph>=0.4",
    "langgraph-checkpoint-postgres>=2.0",
    "mcp>=2.3,<3",
    "psycopg[binary,pool]>=3.2",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyjwt>=2.9",
    "pypdf>=5.0",
    "python-telegram-bot>=21.5",
    "sqlalchemy[asyncio]>=2.0.30",
    "tzdata",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
mcp = [
    "a2a-sdk>=1.3,<2",
    "alembic>=1.13",
    "asyncpg>=0.29",
